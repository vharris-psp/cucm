name: Release VT module

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish module
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="vt-module-vt-cucm-${{ matrix.os }}-${{ matrix.arch }}"
          dotnet publish "VT_CUCM.csproj" \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "artifacts/${{ matrix.rid }}" \
            -p:Version="$version"
          mv "artifacts/${{ matrix.rid }}/vt-module-vt-cucm" "artifacts/$asset"
          sha256sum "artifacts/$asset" > "artifacts/$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: vt-module-vt-cucm-${{ matrix.rid }}
          path: |
            artifacts/vt-module-vt-cucm-${{ matrix.os }}-${{ matrix.arch }}
            artifacts/vt-module-vt-cucm-${{ matrix.os }}-${{ matrix.arch }}.sha256
          if-no-files-found: error

  build-macos-unsigned:
    name: Build unsigned osx-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish unsigned macOS module
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish "VT_CUCM.csproj" \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output artifacts/sign/macos/input/osx-arm64 \
            -p:Version="$version"
      - uses: actions/upload-artifact@v4
        with:
          name: vt-module-vt-cucm-osx-arm64-unsigned
          path: artifacts/sign/macos/input
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - publish
      - build-macos-unsigned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: vt-module-vt-cucm-linux-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag